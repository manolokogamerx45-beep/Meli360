name: mercadolibre_clone
description: "Réplica profesional de la aplicación de Mercado Libre en Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Navegación
  go_router: ^13.0.0
  
  # Manejo de Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  
  # Red
  dio: ^5.4.1
  web_socket_channel: ^3.0.1
  
  # Modelos de Datos
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # UI/UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Generadores de Código
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
